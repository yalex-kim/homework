<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>턴 시뮬레이터 — 마이크로마우스</title>
<style>
:root{--bg:#0d0d1a;--surface:#1e1e2e;--surface2:#2a2a3e;--border:#383851;--text:#cdd6f4;--muted:#6c7086;--accent:#89b4fa;--success:#a6e3a1;--warn:#f9e2af;--error:#f38ba8;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;}
#toolbar{display:flex;align-items:center;gap:12px;padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
#toolbar h1{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;}
#toolbar a{color:var(--muted);font-size:11px;text-decoration:none;border:1px solid var(--border);padding:3px 9px;border-radius:4px;}
#toolbar a:hover{color:var(--text);}
button{border:none;cursor:pointer;border-radius:5px;font-size:12px;padding:5px 11px;font-weight:500;transition:filter .12s;}
button:hover{filter:brightness(1.15);}
.btn-primary{background:var(--accent);color:#1e1e2e;font-weight:700;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.ctrl-row{display:flex;align-items:center;gap:6px;}
label.sl{font-size:11px;color:var(--muted);white-space:nowrap;}

#main{display:flex;flex:1;overflow:hidden;}
#params{width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:10px;}
.sec{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:10px 0 6px;}
.pr{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:4px;}
.pr label{font-size:11px;color:var(--text);flex:1;}
.pr input[type=range]{flex:1;accent-color:var(--accent);}
.pr em{font-size:10px;color:var(--muted);min-width:38px;text-align:right;font-style:normal;}
.pv{font-size:11px;color:var(--accent);font-family:monospace;min-width:40px;text-align:right;}

#stats{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:8px 10px;margin-top:8px;}
.sr{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:4px;}
.sk{color:var(--muted);}
.sv{color:var(--accent);font-family:monospace;}
.sv.ok{color:var(--success);}
.sv.warn{color:var(--warn);}
.sv.err{color:var(--error);}

#canvas-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
#maze-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;}
#maze-wrap canvas{background:var(--bg);border:1px solid var(--border);border-radius:6px;display:block;}
#graph-wrap{height:158px;flex-shrink:0;border-top:1px solid var(--border);padding:4px 8px 4px;}
#graph-wrap canvas{display:block;background:var(--bg);}
</style>
</head>
<body>
<div id="app">

<header id="toolbar">
  <h1>📐 턴 시뮬레이터 (셀 블록)</h1>
  <a href="index.html">← 메인</a>
  <div class="ctrl-row">
    <button id="btn-play" class="btn-primary">▶ 재생</button>
    <button id="btn-reset" class="btn-secondary">↺ 리셋</button>
  </div>
  <div class="ctrl-row">
    <label class="sl">속도</label>
    <input type="range" id="anim-speed" min="0.2" max="4" step="0.2" value="1" style="width:70px;accent-color:var(--accent);">
    <span id="anim-speed-val" style="font-size:11px;min-width:24px;">1.0×</span>
  </div>
  <div class="ctrl-row">
    <label class="sl">방향</label>
    <button id="btn-dir" class="btn-secondary" style="min-width:60px;">우회전 →</button>
  </div>
</header>

<div id="main">
<div id="params">

  <div class="sec">미로 / 로봇</div>
  <div class="pr"><label>셀 크기 C</label><input type="range" id="p-cell" min="100" max="250" step="5" value="180"><span class="pv" id="v-cell">180</span><em>mm</em></div>
  <div class="pr"><label>턴 반경 R</label><input type="range" id="p-r" min="5" max="120" step="1" value="45"><span class="pv" id="v-r">45</span><em>mm</em></div>
  <div class="pr"><label>Tread 폭 L</label><input type="range" id="p-tread" min="30" max="150" step="1" value="86"><span class="pv" id="v-tread">86</span><em>mm</em></div>
  <div class="pr"><label>로봇 폭 W</label><input type="range" id="p-bw" min="20" max="150" step="1" value="80"><span class="pv" id="v-bw">80</span><em>mm</em></div>
  <div class="pr"><label>로봇 길이 H</label><input type="range" id="p-bh" min="20" max="150" step="1" value="90"><span class="pv" id="v-bh">90</span><em>mm</em></div>

  <div class="sec">속도 / 물리</div>
  <div class="pr"><label>최대 속도</label><input type="range" id="p-vmax" min="0.1" max="5" step="0.1" value="1.5"><span class="pv" id="v-vmax">1.5</span><em>m/s</em></div>
  <div class="pr"><label>최대 횡G</label><input type="range" id="p-alat" min="0.5" max="20" step="0.5" value="4.0"><span class="pv" id="v-alat">4.0</span><em>m/s²</em></div>
  <div class="pr"><label>가속도 accel</label><input type="range" id="p-accel" min="0.5" max="30" step="0.5" value="5"><span class="pv" id="v-accel">5.0</span><em>m/s²</em></div>
  <div class="pr"><label>감속도 decel</label><input type="range" id="p-decel" min="0.5" max="30" step="0.5" value="5"><span class="pv" id="v-decel">5.0</span><em>m/s²</em></div>
  <div class="pr"><label>최소 직선 d<sub>min</sub></label><input type="range" id="p-dmin" min="0" max="80" step="5" value="20"><span class="pv" id="v-dmin">20</span><em>mm</em></div>

  <div id="stats">
    <div class="sr"><span class="sk">C − R (진입/진출 직선)</span><span class="sv" id="sv-straight">—</span></div>
    <div class="sr"><span class="sk">셀 내 직선 (C/2 − R)</span><span class="sv" id="sv-incell">—</span></div>
    <div class="sr"><span class="sk">호 길이 (πR/2)</span><span class="sv" id="sv-arc">—</span></div>
    <div class="sr"><span class="sk">총 경로 길이</span><span class="sv" id="sv-total">—</span></div>
    <div class="sr" style="margin-top:6px;"><span class="sk">v_turn (횡G 제한)</span><span class="sv" id="sv-vturn">—</span></div>
    <div class="sr"><span class="sk">v_outer / v_inner</span><span class="sv" id="sv-vwheel">—</span></div>
    <div class="sr"><span class="sk">원심력 / g</span><span class="sv" id="sv-fg">—</span></div>
    <div class="sr"><span class="sk">호 시간</span><span class="sv" id="sv-ttime">—</span></div>
    <div class="sr" style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px;">
      <span class="sk">셀 내 적합 여부</span><span class="sv" id="sv-fit">—</span>
    </div>
    <div class="sr"><span class="sk">직선 거리 충족</span><span class="sv" id="sv-dmin">—</span></div>
  </div>

</div>

<div id="canvas-area">
  <div id="maze-wrap">
    <canvas id="cv"></canvas>
  </div>
  <div id="graph-wrap">
    <canvas id="gc"></canvas>
  </div>
</div>
</div>
</div>

<script>
// ── Control cycle constant ────────────────────────────────────────────────────
const CTRL_DT = 0.001;  // 1 kHz simulated interrupt period (seconds)

// ── Parameters ─────────────────────────────────────────────────────────────────
const P = {
  get C()     { return +document.getElementById('p-cell').value; },
  get R()     { return +document.getElementById('p-r').value; },
  get L()     { return +document.getElementById('p-tread').value; },
  get bw()    { return +document.getElementById('p-bw').value; },
  get bh()    { return +document.getElementById('p-bh').value; },
  get vmax()  { return +document.getElementById('p-vmax').value; },
  get alat()  { return +document.getElementById('p-alat').value; },
  get accel() { return +document.getElementById('p-accel').value; },
  get decel() { return +document.getElementById('p-decel').value; },
  get dmin()  { return +document.getElementById('p-dmin').value; },
};

let turnDir = 'right';  // 'right' | 'left'

// ── Geometry ──────────────────────────────────────────────────────────────────
function computeGeo() {
  const { C, R, L } = P;
  const isLeft = turnDir === 'left';
  const sign = isLeft ? -1 : 1;
  const arcCx = C/2 + sign*R;
  const arcCy = C/2 + R;

  const P_in  = { x: C/2, y: C/2 + R };
  const P_out = { x: C/2 + sign*R, y: C/2 };

  const entryCenter = { x: C/2, y: 3*C/2 };
  const exitCenter  = { x: C/2 + sign*3*C/2, y: C/2 };

  const straightLen = C - R;
  const inCellLen   = C/2 - R;
  const arcLen      = Math.PI * R / 2;
  const totalLen    = 2 * straightLen + arcLen;

  const vTurn  = Math.min(P.vmax, R > 0 ? Math.sqrt(P.alat * R / 1000) : 0);
  const omega  = R > 0 ? vTurn / (R / 1000) : 0;
  const vOuter = omega * (R + L/2) / 1000;
  const vInner = omega * Math.max(0, R - L/2) / 1000;
  const fg     = R > 0 ? (vTurn * vTurn) / (R / 1000) / 9.8 : 0;
  const tArc   = arcLen > 0 && vTurn > 0 ? (arcLen / 1000) / vTurn : 0;

  const N = 80;
  const center = [], left = [], right = [];
  for (let i = 0; i <= N; i++) {
    const phi = (i / N) * Math.PI / 2;
    const rx = arcCx - sign * R * Math.cos(phi);
    const ry = arcCy - R * Math.sin(phi);
    center.push({ x: rx, y: ry, phi });
    const hx = sign * Math.sin(phi), hy = -Math.cos(phi);
    const lnx = hy, lny = -hx;
    const rnx = -hy, rny = hx;
    const hw = L / 2;
    left.push( { x: rx + lnx*hw, y: ry + lny*hw });
    right.push({ x: rx + rnx*hw, y: ry + rny*hw });
  }

  return {
    C, R, L, sign, isLeft,
    arcCx, arcCy, P_in, P_out,
    entryCenter, exitCenter,
    straightLen, inCellLen, arcLen, totalLen,
    vTurn, omega, vOuter, vInner, fg, tArc,
    pts: { center, left, right }, N,
  };
}

// ── Velocity simulation (1 kHz control cycle) ─────────────────────────────────
// Returns array of { t [ms], vL, vR, vC [m/s], phase, pathFrac [0..1] }
// Phase 1: entry straight — both wheels accelerate from 0 to vTurn
// Phase 2: arc            — constant vTurn center, differential vOuter/vInner
// Phase 3: exit straight  — both wheels decelerate from vTurn to 0
function simulateVelocityProfile(geo) {
  const { straightLen, arcLen, totalLen, vTurn, R, L, sign } = geo;
  if (vTurn <= 0 || totalLen <= 0) return [];

  const accel = P.accel, decel = P.decel;
  const R_m = R / 1000, L_m = L / 1000;
  const vOuter = R_m > 0 ? vTurn * (R_m + L_m / 2) / R_m : vTurn;
  const vInner = R_m > 0 ? Math.max(0, vTurn * (R_m - L_m / 2) / R_m) : vTurn;
  // Right turn (sign=+1): robot curves right → left wheel is outer (faster)
  const vL_arc = sign > 0 ? vOuter : vInner;
  const vR_arc = sign > 0 ? vInner : vOuter;

  const pts = [];
  let t = 0, v = 0, pathDistMm = 0;
  const MAX_STEPS = 30000;
  let steps = 0;

  // ── Phase 1: entry straight (ramp 0 → vTurn) ────────────────────────────
  let dEntry = 0;
  while (dEntry < straightLen - 1e-6 && steps++ < MAX_STEPS) {
    v = Math.min(v + accel * CTRL_DT, vTurn);
    const stepMm = v * CTRL_DT * 1000;
    dEntry = Math.min(dEntry + stepMm, straightLen);
    pathDistMm = dEntry;
    t += CTRL_DT;
    pts.push({ t: t * 1000, vL: v, vR: v, vC: v, phase: 'entry', pathFrac: pathDistMm / totalLen });
  }

  // ── Phase 2: arc (constant vTurn, differential wheel speeds) ────────────
  let dArc = 0;
  while (dArc < arcLen - 1e-6 && steps++ < MAX_STEPS) {
    const stepMm = vTurn * CTRL_DT * 1000;
    dArc = Math.min(dArc + stepMm, arcLen);
    pathDistMm = straightLen + dArc;
    t += CTRL_DT;
    pts.push({ t: t * 1000, vL: vL_arc, vR: vR_arc, vC: vTurn, phase: 'arc', pathFrac: pathDistMm / totalLen });
  }

  // ── Phase 3: exit straight (decel vTurn → 0) ────────────────────────────
  v = vTurn;
  let dExit = 0;
  while (dExit < straightLen - 1e-6 && steps++ < MAX_STEPS) {
    const remaining = straightLen - dExit;
    const stopDistMm = (v * v) / (2 * decel) * 1000;
    if (remaining <= stopDistMm + 1e-6) {
      v = Math.max(v - decel * CTRL_DT, 0);
    } else {
      v = Math.min(v + accel * CTRL_DT, vTurn);
    }
    const stepMm = v * CTRL_DT * 1000;
    dExit = Math.min(dExit + stepMm, straightLen);
    pathDistMm = straightLen + arcLen + dExit;
    t += CTRL_DT;
    pts.push({ t: t * 1000, vL: v, vR: v, vC: v, phase: 'exit', pathFrac: pathDistMm / totalLen });
  }

  return pts;
}

// Map path fraction (animT) → simulation time (ms)
function findTimeAtFrac(sim, frac) {
  if (!sim.length) return 0;
  for (let i = 0; i < sim.length; i++) {
    if (sim[i].pathFrac >= frac) {
      if (i === 0) return 0;
      const p0 = sim[i - 1], p1 = sim[i];
      const f = (frac - p0.pathFrac) / (p1.pathFrac - p0.pathFrac + 1e-12);
      return p0.t + f * (p1.t - p0.t);
    }
  }
  return sim[sim.length - 1].t;
}

// ── Position along path (t ∈ [0,1]) ──────────────────────────────────────────
function pathAt(geo, t) {
  const { C, R, sign, straightLen, arcLen, totalLen } = geo;
  const ef = straightLen / totalLen;
  const af = arcLen / totalLen;

  if (t <= ef) {
    const frac = ef > 0 ? t / ef : 0;
    return { x: C/2, y: 3*C/2 - frac*straightLen, angle: 0 };
  } else if (t <= ef + af) {
    const frac = af > 0 ? (t - ef) / af : 0;
    const phi  = frac * Math.PI / 2;
    const rx   = geo.arcCx - sign * R * Math.cos(phi);
    const ry   = geo.arcCy - R * Math.sin(phi);
    return { x: rx, y: ry, angle: phi * sign };
  } else {
    const frac = (1 - ef - af) > 0 ? (t - ef - af) / (1 - ef - af) : 0;
    return {
      x: C/2 + sign*(R + frac*straightLen),
      y: C/2,
      angle: sign * Math.PI / 2,
    };
  }
}

// ── Canvas / scale ────────────────────────────────────────────────────────────
const cv = document.getElementById('cv');
const gc = document.getElementById('gc');

function resizeCanvas() {
  const wrap = document.getElementById('maze-wrap');
  const sz = Math.min(wrap.clientWidth - 24, wrap.clientHeight - 24);
  cv.width = cv.height = Math.max(sz, 200);

  const gw = document.getElementById('graph-wrap');
  gc.width  = Math.max(gw.clientWidth,  300);
  gc.height = Math.max(gw.clientHeight, 80);
}

function makeTransform(C, isLeft) {
  const PAD  = C * 0.15;
  const xMin = isLeft ? -C - PAD : -PAD;
  const xMax = isLeft ? C + PAD  : 2*C + PAD;
  const yMin = -PAD;
  const yMax = 2*C + PAD;
  const rangeX = xMax - xMin, rangeY = yMax - yMin;
  const scale  = Math.min(cv.width / rangeX, cv.height / rangeY);
  const offX   = (cv.width  - rangeX*scale) / 2 - xMin*scale;
  const offY   = (cv.height - rangeY*scale) / 2 - yMin*scale;
  return { scale, offX, offY };
}

function px(tf, x, y) {
  return [tf.offX + x*tf.scale, tf.offY + y*tf.scale];
}

// ── Drawing helpers ───────────────────────────────────────────────────────────
function drawLine(ctx, tf, x0,y0,x1,y1) {
  ctx.beginPath();
  ctx.moveTo(...px(tf,x0,y0));
  ctx.lineTo(...px(tf,x1,y1));
  ctx.stroke();
}

function drawPolyline(ctx, tf, pts) {
  if (!pts.length) return;
  ctx.beginPath();
  ctx.moveTo(...px(tf, pts[0].x, pts[0].y));
  for (let i = 1; i < pts.length; i++) ctx.lineTo(...px(tf, pts[i].x, pts[i].y));
  ctx.stroke();
}

function drawRobotBody(ctx, tf, x, y, angle, bw, bh, alpha) {
  const [cx, cy] = px(tf, x, y);
  const s = tf.scale;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.globalAlpha = alpha;
  const hw = (bw/2)*s, hh = (bh/2)*s;
  const ch = Math.min(hw, hh) * 0.2;
  ctx.beginPath();
  ctx.moveTo(-hw+ch,-hh); ctx.lineTo(hw-ch,-hh);
  ctx.lineTo(hw,-hh+ch);  ctx.lineTo(hw,hh-ch);
  ctx.lineTo(hw-ch,hh);   ctx.lineTo(-hw+ch,hh);
  ctx.lineTo(-hw,hh-ch);  ctx.lineTo(-hw,-hh+ch);
  ctx.closePath();
  ctx.fillStyle = '#162540';
  ctx.strokeStyle = '#3a8fe8';
  ctx.lineWidth = 1.5;
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,-hh*0.7); ctx.lineTo(-hh*0.18,-hh*0.25); ctx.lineTo(hh*0.18,-hh*0.25);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,215,50,0.85)';
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawDimLine(ctx, tf, x0,y0,x1,y1, label, color='#6c7086') {
  const [px0,py0] = px(tf,x0,y0);
  const [px1,py1] = px(tf,x1,y1);
  ctx.strokeStyle = color;
  ctx.fillStyle   = color;
  ctx.lineWidth   = 1;
  ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(px0,py0); ctx.lineTo(px1,py1); ctx.stroke();
  ctx.setLineDash([]);
  const dx=px1-px0, dy=py1-py0, len=Math.sqrt(dx*dx+dy*dy)||1;
  const ux=dx/len, uy=dy/len, hs=7;
  [[px0,py0,1],[px1,py1,-1]].forEach(([ax,ay,s]) => {
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax-s*ux*hs + uy*hs*0.4, ay-s*uy*hs - ux*hs*0.4);
    ctx.lineTo(ax-s*ux*hs - uy*hs*0.4, ay-s*uy*hs + ux*hs*0.4);
    ctx.closePath(); ctx.fill();
  });
  ctx.font = `bold ${Math.max(9,Math.round(tf.scale*3.5))}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, (px0+px1)/2 + uy*13, (py0+py1)/2 - ux*13);
}

// ── Velocity graph ────────────────────────────────────────────────────────────
function drawGraph(sim) {
  const ctx = gc.getContext('2d');
  ctx.clearRect(0, 0, gc.width, gc.height);
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, gc.width, gc.height);

  if (!sim || sim.length < 2) {
    ctx.fillStyle = '#6c7086';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('v_turn = 0 (R 또는 a_lat 확인)', gc.width / 2, gc.height / 2);
    return;
  }

  const PAD = { t: 20, r: 12, b: 30, l: 44 };
  const W = gc.width  - PAD.l - PAD.r;
  const H = gc.height - PAD.t - PAD.b;

  const tMax = sim[sim.length - 1].t;  // ms
  const vMax = Math.max(...sim.map(p => Math.max(p.vL, p.vR))) * 1.18 || 1;

  const tx = (t) => PAD.l + (t / tMax) * W;
  const ty = (v) => PAD.t + H - (v / vMax) * H;

  // Phase boundary times
  let phaseEntryEnd = 0, phaseArcEnd = 0;
  for (let i = 0; i < sim.length - 1; i++) {
    if (sim[i].phase === 'entry' && sim[i+1].phase === 'arc')  phaseEntryEnd = sim[i].t;
    if (sim[i].phase === 'arc'   && sim[i+1].phase === 'exit') phaseArcEnd   = sim[i].t;
  }
  if (phaseArcEnd === 0) phaseArcEnd = tMax;

  // Phase zone backgrounds
  const fillZone = (t0, t1, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(tx(t0), PAD.t, Math.max(tx(t1) - tx(t0), 0), H);
  };
  fillZone(0,             phaseEntryEnd, 'rgba(249,226,175,0.04)');
  fillZone(phaseEntryEnd, phaseArcEnd,   'rgba(166,227,161,0.07)');
  fillZone(phaseArcEnd,   tMax,          'rgba(249,226,175,0.04)');

  // Grid lines
  ctx.lineWidth = 0.5;
  ctx.setLineDash([2, 4]);

  const vStep = vMax > 3 ? 1 : vMax > 1.5 ? 0.5 : 0.25;
  ctx.strokeStyle = 'rgba(56,56,81,0.55)';
  for (let v = 0; v <= vMax; v += vStep) {
    ctx.beginPath(); ctx.moveTo(PAD.l, ty(v)); ctx.lineTo(PAD.l + W, ty(v)); ctx.stroke();
  }
  const tStep = tMax > 600 ? 200 : tMax > 300 ? 100 : tMax > 150 ? 50 : tMax > 60 ? 20 : 10;
  for (let t = 0; t <= tMax; t += tStep) {
    ctx.beginPath(); ctx.moveTo(tx(t), PAD.t); ctx.lineTo(tx(t), PAD.t + H); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Phase separator lines
  ctx.strokeStyle = 'rgba(108,112,134,0.45)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  for (const t of [phaseEntryEnd, phaseArcEnd]) {
    if (t > 0 && t < tMax) {
      ctx.beginPath(); ctx.moveTo(tx(t), PAD.t); ctx.lineTo(tx(t), PAD.t + H); ctx.stroke();
    }
  }
  ctx.setLineDash([]);

  // Velocity lines — center first (behind), then wheels on top
  const polyline = (keyFn, color, lw) => {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    sim.forEach((p, i) => { i === 0 ? ctx.moveTo(tx(p.t), ty(keyFn(p))) : ctx.lineTo(tx(p.t), ty(keyFn(p))); });
    ctx.stroke();
  };
  polyline(p => p.vC, 'rgba(249,226,175,0.30)', 1.5);
  polyline(p => p.vR, '#89b4fa', 2);
  polyline(p => p.vL, '#f38ba8', 2);

  // Axes
  ctx.strokeStyle = '#383851';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PAD.l, PAD.t); ctx.lineTo(PAD.l, PAD.t + H);
  ctx.moveTo(PAD.l, PAD.t + H); ctx.lineTo(PAD.l + W, PAD.t + H);
  ctx.stroke();

  // Y-axis labels (velocity)
  ctx.fillStyle = '#6c7086';
  ctx.font = '9px monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let v = 0; v <= vMax; v += vStep) {
    ctx.fillText(v.toFixed(v % 1 === 0 ? 0 : (v % 0.5 === 0 ? 1 : 2)), PAD.l - 3, ty(v));
  }

  // X-axis labels (time)
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let t = 0; t <= tMax; t += tStep) {
    ctx.fillText(t, tx(t), PAD.t + H + 3);
  }

  // Axis unit labels
  ctx.fillStyle = '#4a4a6a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('ms', PAD.l + W / 2, gc.height - 1);
  ctx.save();
  ctx.translate(10, PAD.t + H / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textBaseline = 'middle';
  ctx.fillText('m/s', 0, 0);
  ctx.restore();

  // Phase labels (above plot area)
  ctx.fillStyle = 'rgba(108,112,134,0.75)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  if (phaseEntryEnd > 0) ctx.fillText('진입', tx(phaseEntryEnd / 2), PAD.t + 2);
  ctx.fillText('호', tx((phaseEntryEnd + phaseArcEnd) / 2), PAD.t + 2);
  if (phaseArcEnd < tMax) ctx.fillText('진출', tx((phaseArcEnd + tMax) / 2), PAD.t + 2);

  // Legend
  const isLeft = turnDir === 'left';
  const legItems = [
    { color: '#f38ba8', label: `좌 (${isLeft ? '내측' : '외측'})` },
    { color: '#89b4fa', label: `우 (${isLeft ? '외측' : '내측'})` },
    { color: 'rgba(249,226,175,0.65)', label: '중심' },
  ];
  ctx.lineWidth = 2;
  legItems.forEach(({ color, label }, i) => {
    const lx = PAD.l + 6 + i * 72;
    const ly = PAD.t + H + 19;
    ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 14, ly); ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, lx + 17, ly);
  });

  // Current-position time marker (tracks animation)
  if (animT > 0 && animT < 1) {
    const curTimeMs = findTimeAtFrac(sim, animT);
    const mx = tx(curTimeMs);

    ctx.strokeStyle = 'rgba(205,214,244,0.80)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(mx, PAD.t); ctx.lineTo(mx, PAD.t + H); ctx.stroke();
    ctx.setLineDash([]);

    // Dot at each wheel velocity
    const ptIdx = sim.findIndex(p => p.t >= curTimeMs);
    if (ptIdx > 0) {
      const p = sim[ptIdx];
      for (const [v, color] of [[p.vL, '#f38ba8'], [p.vR, '#89b4fa']]) {
        ctx.beginPath();
        ctx.arc(mx, ty(v), 3.5, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }
      // Time label
      ctx.fillStyle = 'rgba(205,214,244,0.65)';
      ctx.font = '9px monospace';
      ctx.textAlign = mx > PAD.l + W * 0.75 ? 'right' : 'left';
      ctx.textBaseline = 'bottom';
      const labelX = mx > PAD.l + W * 0.75 ? mx - 3 : mx + 3;
      ctx.fillText(`${curTimeMs.toFixed(0)}ms`, labelX, PAD.t + H - 1);
    }
  }
}

// ── Main draw ─────────────────────────────────────────────────────────────────
let animT  = 0;
let playing = false;
let animSpeed = 1.0;
let lastTS = null;

function draw() {
  const geo = computeGeo();
  const sim = simulateVelocityProfile(geo);
  drawMaze(geo);
  drawGraph(sim);
  updateStats(geo);
}

function drawMaze(geo) {
  const { C, R, L, sign, isLeft, arcCx, arcCy } = geo;
  const tf = makeTransform(C, isLeft);

  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, cv.width, cv.height);

  // ── Cell backgrounds ──────────────────────────────────────────────────────
  const cellBg = 'rgba(137,180,250,0.05)';
  const goalBg = 'rgba(166,227,161,0.08)';
  const [ax,ay] = px(tf,0,0);
  const cs = C*tf.scale;
  ctx.fillStyle = cellBg;
  ctx.fillRect(ax,ay,cs,cs);
  ctx.fillRect(...px(tf,0,C), cs,cs);
  ctx.fillStyle = goalBg;
  ctx.fillRect(...px(tf,sign*C, 0), cs, cs);

  ctx.fillStyle = 'rgba(108,112,134,0.7)';
  ctx.font = `${Math.max(9,Math.round(tf.scale*4))}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('턴 셀', ...px(tf, C/2, C/2));
  ctx.fillText('진입 셀', ...px(tf, C/2, 3*C/2));
  ctx.fillText('진출 셀', ...px(tf, sign*C + sign*C/2, C/2));

  // ── Walls ─────────────────────────────────────────────────────────────────
  ctx.strokeStyle = '#cdd6f4';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'square';
  drawLine(ctx,tf, 0,0, C,0);
  drawLine(ctx,tf, 0,0, 0,2*C);
  drawLine(ctx,tf, 0,2*C, C,2*C);
  drawLine(ctx,tf, C,C, C,2*C);
  drawLine(ctx,tf, sign*C,0, sign*2*C,0);
  drawLine(ctx,tf, sign*2*C,0, sign*2*C,C);
  drawLine(ctx,tf, sign*C,C, sign*2*C,C);

  ctx.strokeStyle = 'rgba(205,214,244,0.15)';
  ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  drawLine(ctx,tf, 0,C, C,C);
  drawLine(ctx,tf, sign*C,0, sign*C,C);
  ctx.setLineDash([]);

  // ── Wheel tracks (full path, dim) ──────────────────────────────────────────
  const lhw = L/2;
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(243,139,168,0.28)';
  drawLine(ctx,tf, C/2-lhw, 3*C/2, C/2-lhw, C/2+R);
  ctx.strokeStyle = 'rgba(137,180,250,0.28)';
  drawLine(ctx,tf, C/2+lhw, 3*C/2, C/2+lhw, C/2+R);

  ctx.strokeStyle = 'rgba(243,139,168,0.28)';
  drawPolyline(ctx, tf, geo.pts.left);
  ctx.strokeStyle = 'rgba(137,180,250,0.28)';
  drawPolyline(ctx, tf, geo.pts.right);

  ctx.strokeStyle = 'rgba(243,139,168,0.28)';
  drawLine(ctx,tf, C/2+sign*R, C/2-lhw, sign*3*C/2, C/2-lhw);
  ctx.strokeStyle = 'rgba(137,180,250,0.28)';
  drawLine(ctx,tf, C/2+sign*R, C/2+lhw, sign*3*C/2, C/2+lhw);

  // ── Center path (full, dim) ────────────────────────────────────────────────
  ctx.strokeStyle = 'rgba(249,226,175,0.22)';
  ctx.lineWidth = 2;
  drawLine(ctx,tf, C/2, 3*C/2, C/2, C/2+R);
  drawPolyline(ctx, tf, geo.pts.center);
  drawLine(ctx,tf, C/2+sign*R, C/2, sign*3*C/2, C/2);

  // ── Animated traveled portion ──────────────────────────────────────────────
  if (animT > 0) {
    const entryLen = geo.straightLen;
    const ef = entryLen / geo.totalLen;
    const af = geo.arcLen / geo.totalLen;

    ctx.lineWidth = 2.5;

    const drawTraveledEntry = (tFrac) => {
      const yStart = 3*C/2, yEnd = C/2+R;
      const yNow = yStart - tFrac*(yStart-yEnd);
      ctx.strokeStyle = '#f9e2af';
      drawLine(ctx,tf, C/2,yStart, C/2,yNow);
      ctx.strokeStyle = '#f38ba8';
      drawLine(ctx,tf, C/2-lhw,yStart, C/2-lhw,yNow);
      ctx.strokeStyle = '#89b4fa';
      drawLine(ctx,tf, C/2+lhw,yStart, C/2+lhw,yNow);
    };

    const drawTraveledArc = (phiMax) => {
      const ni = Math.floor(phiMax / (Math.PI/2) * geo.N);
      const sub = {
        center: geo.pts.center.slice(0,ni+1),
        left:   geo.pts.left.slice(0,ni+1),
        right:  geo.pts.right.slice(0,ni+1),
      };
      ctx.strokeStyle = '#f9e2af'; drawPolyline(ctx,tf,sub.center);
      ctx.strokeStyle = '#f38ba8'; drawPolyline(ctx,tf,sub.left);
      ctx.strokeStyle = '#89b4fa'; drawPolyline(ctx,tf,sub.right);
    };

    const drawTraveledExit = (tFrac) => {
      const xStart = C/2+sign*R, xEnd = sign*3*C/2;
      const xNow = xStart + tFrac*(xEnd-xStart);
      ctx.strokeStyle = '#f9e2af';
      drawLine(ctx,tf, xStart,C/2, xNow,C/2);
      ctx.strokeStyle = '#f38ba8';
      drawLine(ctx,tf, xStart,C/2-lhw, xNow,C/2-lhw);
      ctx.strokeStyle = '#89b4fa';
      drawLine(ctx,tf, xStart,C/2+lhw, xNow,C/2+lhw);
    };

    if (animT <= ef) {
      drawTraveledEntry(ef > 0 ? animT/ef : 1);
    } else if (animT <= ef+af) {
      drawTraveledEntry(1);
      drawTraveledArc((animT-ef)/af * Math.PI/2);
    } else {
      drawTraveledEntry(1);
      drawTraveledArc(Math.PI/2);
      drawTraveledExit(af+ef < 1 ? (animT-ef-af)/(1-ef-af) : 1);
    }
  }

  // ── Ghost robots at key positions ──────────────────────────────────────────
  for (const [t,a] of [[0,0.18],[0.5,0.12],[1,0.18]]) {
    const p = pathAt(geo, t);
    drawRobotBody(ctx, tf, p.x, p.y, p.angle, P.bw, P.bh, a);
  }
  {
    const p = pathAt(geo, animT);
    drawRobotBody(ctx, tf, p.x, p.y, p.angle, P.bw, P.bh, 0.9);
  }

  // ── Arc center (ICR) ───────────────────────────────────────────────────────
  {
    const [icx,icy] = px(tf, arcCx, arcCy);
    ctx.beginPath(); ctx.arc(icx,icy,5,0,Math.PI*2);
    ctx.strokeStyle='#a6e3a1'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(icx-8,icy); ctx.lineTo(icx+8,icy);
    ctx.moveTo(icx,icy-8); ctx.lineTo(icx,icy+8);
    ctx.stroke();
    ctx.fillStyle='#a6e3a1';
    ctx.font='10px monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('ICR',icx+7,icy+2);
    const p0 = geo.pts.center[Math.floor(geo.N/4)];
    ctx.strokeStyle='rgba(166,227,161,0.4)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(icx,icy); ctx.lineTo(...px(tf,p0.x,p0.y)); ctx.stroke();
    ctx.setLineDash([]);
    const [mx,my]=px(tf,(arcCx+p0.x)/2,(arcCy+p0.y)/2);
    ctx.fillStyle='rgba(166,227,161,0.8)';
    ctx.font=`bold ${Math.max(9,Math.round(tf.scale*3.5))}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(`R=${R}`, mx, my);
  }

  // ── Dimension annotations ──────────────────────────────────────────────────
  const annColor = '#6c7086';
  drawDimLine(ctx,tf, C+10,3*C/2, C+10,C/2+R, `${geo.straightLen.toFixed(0)}mm`, annColor);
  drawDimLine(ctx,tf, C/2+sign*R, C+10, sign*3*C/2, C+10, `${geo.straightLen.toFixed(0)}mm`, annColor);
  if (geo.inCellLen > 2) {
    ctx.strokeStyle='rgba(108,112,134,0.5)'; ctx.lineWidth=1; ctx.setLineDash([2,4]);
    drawLine(ctx,tf, C/2,C/2+R, C/2,C);
    ctx.setLineDash([]);
  }

  // ── Warn if arc exceeds turning cell ─────────────────────────────────────
  if (R > C/2) {
    ctx.strokeStyle = 'rgba(243,139,168,0.4)';
    ctx.lineWidth = 3;
    const warningPts = geo.pts.center.filter(p => p.y > C || Math.abs(p.x - C/2) > C/2);
    if (warningPts.length) {
      ctx.beginPath();
      warningPts.forEach((p,i) => {
        const [px_, py_] = px(tf,p.x,p.y);
        i===0 ? ctx.moveTo(px_,py_) : ctx.lineTo(px_,py_);
      });
      ctx.stroke();
    }
  }
}

// ── Stats ──────────────────────────────────────────────────────────────────────
function sv(id, text, cls='') {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'sv' + (cls ? ' ' + cls : '');
}

function updateStats(geo) {
  const { C, R, straightLen, inCellLen, arcLen, totalLen,
          vTurn, vOuter, vInner, fg, tArc } = geo;
  const dmin = P.dmin;
  const fits = R <= C/2;
  const straight_ok = straightLen >= dmin;

  sv('sv-straight', `${straightLen.toFixed(1)} mm`, fits && straight_ok ? 'ok' : straight_ok ? 'warn' : 'err');
  sv('sv-incell', `${inCellLen.toFixed(1)} mm`, inCellLen >= 0 ? '' : 'err');
  sv('sv-arc',     `${arcLen.toFixed(1)} mm`);
  sv('sv-total',   `${totalLen.toFixed(1)} mm`);
  sv('sv-vturn',   `${vTurn.toFixed(3)} m/s`);
  sv('sv-vwheel',  `${vOuter.toFixed(3)} / ${vInner.toFixed(3)} m/s`);
  sv('sv-fg',      `${fg.toFixed(3)} g`);
  sv('sv-ttime',   `${(tArc*1000).toFixed(1)} ms`);
  sv('sv-fit', fits ? `✓ R(${R}) ≤ C/2(${C/2})` : `✗ R(${R}) > C/2(${C/2})`,
     fits ? 'ok' : 'err');
  sv('sv-dmin', straight_ok ? `✓ ${straightLen.toFixed(0)} ≥ ${dmin}mm` : `✗ ${straightLen.toFixed(0)} < ${dmin}mm`,
     straight_ok ? 'ok' : 'err');
}

// ── Animation ─────────────────────────────────────────────────────────────────
function animFrame(ts) {
  if (!playing) return;
  if (lastTS === null) lastTS = ts;
  const dt = ts - lastTS;
  lastTS = ts;

  const geo = computeGeo();
  const sim = simulateVelocityProfile(geo);
  // Use physics-accurate total time from simulation as animation duration
  const totalMs = sim.length > 0 ? sim[sim.length - 1].t : (geo.tArc * (geo.totalLen / (geo.arcLen || 1)) * 1000);
  const dur = Math.max(totalMs, 100) / animSpeed;

  animT = Math.min(animT + dt / dur, 1);
  drawMaze(geo);
  drawGraph(sim);
  updateStats(geo);

  if (animT >= 1) {
    playing = false;
    document.getElementById('btn-play').textContent = '▶ 재생';
    lastTS = null;
    return;
  }
  requestAnimationFrame(animFrame);
}

document.getElementById('btn-play').onclick = () => {
  if (playing) {
    playing = false;
    document.getElementById('btn-play').textContent = '▶ 재생';
    lastTS = null;
  } else {
    if (animT >= 1) animT = 0;
    playing = true;
    document.getElementById('btn-play').textContent = '⏸ 정지';
    lastTS = null;
    requestAnimationFrame(animFrame);
  }
};

document.getElementById('btn-reset').onclick = () => {
  playing = false;
  document.getElementById('btn-play').textContent = '▶ 재생';
  animT = 0; lastTS = null;
  draw();
};

document.getElementById('btn-dir').onclick = () => {
  turnDir = turnDir === 'right' ? 'left' : 'right';
  document.getElementById('btn-dir').textContent = turnDir === 'right' ? '우회전 →' : '좌회전 ←';
  animT = 0; draw();
};

document.getElementById('anim-speed').oninput = e => {
  animSpeed = parseFloat(e.target.value);
  document.getElementById('anim-speed-val').textContent = animSpeed.toFixed(1) + '×';
};

// ── Param sliders ─────────────────────────────────────────────────────────────
const SLIDERS = [
  ['p-cell','v-cell',1],['p-r','v-r',1],['p-tread','v-tread',1],
  ['p-bw','v-bw',1],['p-bh','v-bh',1],
  ['p-vmax','v-vmax',1],['p-alat','v-alat',1],
  ['p-accel','v-accel',1],['p-decel','v-decel',1],
  ['p-dmin','v-dmin',1],
];
SLIDERS.forEach(([sid, vid, dec]) => {
  const el = document.getElementById(sid);
  el.oninput = () => {
    document.getElementById(vid).textContent = parseFloat(el.value).toFixed(dec);
    animT = 0;
    if (sid === 'p-cell') {
      document.getElementById('p-r').max = parseFloat(el.value);
    }
    draw();
  };
});

window.addEventListener('resize', () => { resizeCanvas(); draw(); });

resizeCanvas();
draw();
</script>
