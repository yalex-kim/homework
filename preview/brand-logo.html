<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:28px;background:var(--paper-1);display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.logo{display:flex;align-items:baseline;gap:10px;}
.mark{width:28px;height:28px;background:var(--clay-2);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px;font-style:italic;align-self:center;}
.word{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--ink-1);letter-spacing:-0.02em;}
.word em{font-style:italic;color:var(--clay-2);font-weight:500;}
.tag{font-family:var(--font-body);font-size:12px;color:var(--fg-soft);letter-spacing:.15em;text-transform:uppercase;margin-top:4px;margin-left:38px;}
</style></head><body>
<div class="logo">
  <div class="mark">y</div>
  <div class="word">yAlex's <em>HomeWork</em></div>
</div>
<div class="tag">a quiet desk · 혼자의 책상</div>
</body></html>
