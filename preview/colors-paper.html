<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:20px;background:var(--bg-app);}
.row{display:flex;gap:10px;align-items:stretch;}
.sw{flex:1;border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:92px;border:1px solid var(--border-soft);}
.sw .name{font-family:var(--font-mono);font-size:11px;}
.sw .hex{font-family:var(--font-mono);font-size:11px;opacity:.75;}
.sw .lbl{font-family:var(--font-body);font-weight:600;font-size:13px;}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--paper-0);color:var(--ink-1)"><div><div class="lbl">paper-0</div><div class="name">App bg</div></div><div class="hex">#FDFAF4</div></div>
  <div class="sw" style="background:var(--paper-1);color:var(--ink-1)"><div><div class="lbl">paper-1</div><div class="name">Base</div></div><div class="hex">#FBF6ED</div></div>
  <div class="sw" style="background:var(--paper-2);color:var(--ink-1)"><div><div class="lbl">paper-2</div><div class="name">Card</div></div><div class="hex">#F3EADA</div></div>
  <div class="sw" style="background:var(--paper-3);color:var(--ink-1)"><div><div class="lbl">paper-3</div><div class="name">Divider</div></div><div class="hex">#E8DCC6</div></div>
  <div class="sw" style="background:var(--paper-4);color:var(--ink-1)"><div><div class="lbl">paper-4</div><div class="name">Active chip</div></div><div class="hex">#D7C6A8</div></div>
</div>
</body></html>
