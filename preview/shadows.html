<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:28px;background:var(--bg-app);display:flex;gap:32px;align-items:center;}
.box{width:140px;height:100px;background:var(--paper-1);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);}
.sm{box-shadow:var(--shadow-sm);}

<div class="box sm">shadow-sm</div>
<div class="box md">shadow-md</div>
<div class="box lg">shadow-lg</div>
</body></html>
