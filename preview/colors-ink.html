<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:20px;background:var(--bg-app);}
.row{display:flex;gap:10px;}
.sw{flex:1;border-radius:var(--radius-md);padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;}
.sw .name{font-family:var(--font-mono);font-size:11px;}
.sw .hex{font-family:var(--font-mono);font-size:11px;opacity:.75;}
.sw .lbl{font-family:var(--font-body);font-weight:600;font-size:13px;}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--ink-1);color:#fbf6ed"><div><div class="lbl">ink-1</div><div class="name">Body text</div></div><div class="hex">#2D2520</div></div>
  <div class="sw" style="background:var(--ink-2);color:#fbf6ed"><div><div class="lbl">ink-2</div><div class="name">Muted</div></div><div class="hex">#5B4A3E</div></div>
  <div class="sw" style="background:var(--ink-3);color:#fbf6ed"><div><div class="lbl">ink-3</div><div class="name">Soft</div></div><div class="hex">#8C7F72</div></div>
  <div class="sw" style="background:var(--ink-4);color:#2D2520"><div><div class="lbl">ink-4</div><div class="name">Disabled</div></div><div class="hex">#B8AD9F</div></div>
</div>
</body></html>
