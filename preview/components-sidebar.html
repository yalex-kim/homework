<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:18px;background:var(--paper-1);width:240px;min-height:360px;}
.brand{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink-1);margin-bottom:4px;}
.sub{font-size:11px;color:var(--fg-soft);margin-bottom:20px;letter-spacing:.05em;}
.section{font-size:11px;color:var(--fg-soft);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px;}
.item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--ink-2);cursor:pointer;transition:background 150ms;}
.item:hover{background:var(--paper-2);}
.item.active{background:var(--clay-soft);color:var(--clay-3);font-weight:500;}
.ic{width:16px;height:16px;border-radius:3px;background:currentColor;opacity:.55;flex:none;}
</style></head><body>
<div class="brand">yAlex's HomeWork</div>
<div class="sub">혼자의 책상</div>
<div class="item active"><span class="ic"></span>오늘</div>
<div class="item"><span class="ic"></span>할 일</div>
<div class="item"><span class="ic"></span>저널</div>
<div class="section">MY SPACES</div>
<div class="item"><span class="ic"></span>가족 여행</div>
<div class="item"><span class="ic"></span>주식</div>
<div class="item"><span class="ic"></span>북마크</div>
<div class="item"><span class="ic"></span>가계부</div>
</body></html>
