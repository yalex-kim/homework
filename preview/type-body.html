<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:24px;background:var(--bg-app);}
.row{padding:8px 0;border-bottom:1px solid var(--border-soft);display:flex;align-items:baseline;gap:16px;}
.row:last-child{border-bottom:none;}
.tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-soft);width:80px;flex:none;}
.size{font-family:var(--font-mono);font-size:11px;color:var(--fg-soft);margin-left:auto;flex:none;}
</style></head><body>
<div class="row"><span class="tag">lead</span><span style="font-size:18px;color:var(--fg-muted);">조용한 저녁이에요. 오늘 하루는 어땠나요?</span><span class="size">18/muted</span></div>
<div class="row"><span class="tag">body</span><span style="font-size:15px;">작년 봄에 아이와 함께 다녀온 교토의 골목길을 떠올렸다.</span><span class="size">15/default</span></div>
<div class="row"><span class="tag">small</span><span style="font-size:13px;color:var(--fg-muted);">2026년 4월 18일 · 토요일 저녁</span><span class="size">13/muted</span></div>
<div class="row"><span class="tag">eyebrow</span><span class="eyebrow">TODAY &nbsp;·&nbsp; JOURNAL</span><span class="size">12/soft</span></div>
<div class="row"><span class="tag">mono</span><span class="mono" style="color:var(--fg-default)">AAPL &nbsp; +1.24% &nbsp; $184.32</span><span class="size">JetBrains</span></div>
<div class="row"><span class="tag">italic</span><span class="serif-italic">— 기록되지 않은 하루는 흘러간다.</span><span class="size">Lora italic</span></div>
</body></html>
