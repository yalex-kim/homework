<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:24px;background:var(--bg-app);display:flex;flex-direction:column;gap:14px;}
.card{background:var(--paper-1);border:1px solid var(--border-soft);border-radius:8px;padding:20px;box-shadow:var(--shadow-sm);transition:box-shadow 200ms;}
.card:hover{box-shadow:var(--shadow-md);}
.card h4{margin:0 0 4px;font-family:var(--font-display);font-size:18px;font-weight:600;}
.card .meta{font-size:12px;color:var(--fg-soft);margin-bottom:8px;font-family:var(--font-mono);}
.card p{margin:0;color:var(--fg-muted);font-size:14px;line-height:1.55;}
.photo-card{background:var(--paper-1);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);}
.photo-card .ph{height:90px;background:linear-gradient(135deg,#E8DCC6 0%,#D7C6A8 100%);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:12px;font-family:var(--font-mono);}
.photo-card .body{padding:12px 16px;}
.photo-card h4{margin:0 0 2px;font-family:var(--font-display);font-size:15px;}
.photo-card .meta{font-size:11px;color:var(--fg-soft);}
</style></head><body>
<div class="card">
  <div class="meta">2026.04.18 · 저널</div>
  <h4>조용한 저녁</h4>
  <p>오늘은 아이가 일찍 잠들었다. 서재에 혼자 앉아 있으니 창밖의 바람 소리가 유난히 크게 들렸다.</p>
</div>
<div class="photo-card">
  <div class="ph">[ photo ]</div>
  <div class="body"><h4>가을의 교토</h4><div class="meta">2025.11 · 3박 4일</div></div>
</div>
</body></html>
