<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:28px;background:var(--bg-app);}
.wrap{display:flex;gap:20px;align-items:flex-start;}
.gradient{width:180px;height:100px;border-radius:10px;display:flex;align-items:flex-end;padding:10px 12px;font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,0.85);}
.g1{background:linear-gradient(135deg,#C7996C 0%,#8E4427 100%);}
.g2{background:linear-gradient(135deg,#8FA3A8 0%,#556373 100%);}
.g3{background:linear-gradient(135deg,#9FAF82 0%,#4E5A39 100%);}
.g4{background:linear-gradient(135deg,#B08A7E 0%,#8E4427 100%);}
</style></head><body>
<div class="wrap">
  <div class="gradient g1">autumn / clay</div>
  <div class="gradient g2">winter / slate</div>
  <div class="gradient g3">forest / moss</div>
  <div class="gradient g4">dusk / earth</div>
</div>
</body></html>
