<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:20px;background:var(--bg-app);}
.row{display:flex;gap:10px;}
.sw{flex:1;border-radius:var(--radius-md);padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;}
.sw .name{font-family:var(--font-mono);font-size:11px;}
.sw .hex{font-family:var(--font-mono);font-size:11px;opacity:.75;}
.sw .lbl{font-family:var(--font-body);font-weight:600;font-size:13px;}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--success);color:#fff"><div><div class="lbl">success</div><div class="name">moss-2</div></div><div class="hex">#6B7A4F</div></div>
  <div class="sw" style="background:var(--danger);color:#fff"><div><div class="lbl">danger</div><div class="name">terracotta</div></div><div class="hex">#9B4A3A</div></div>
  <div class="sw" style="background:var(--info-2);color:#fff"><div><div class="lbl">info</div><div class="name">slate warm</div></div><div class="hex">#556373</div></div>
  <div class="sw" style="background:var(--success-soft);color:var(--moss-3)"><div><div class="lbl">success soft</div></div><div class="hex">#E4E8D9</div></div>
  <div class="sw" style="background:var(--danger-soft);color:var(--danger-2)"><div><div class="lbl">danger soft</div></div><div class="hex">#F2DCD4</div></div>
</div>
</body></html>
