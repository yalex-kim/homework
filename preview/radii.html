<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:20px;background:var(--bg-app);display:flex;gap:18px;align-items:center;}
.box{width:100px;height:80px;background:var(--paper-2);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);}
</style></head><body>
<div class="box" style="border-radius:4px">xs · 4</div>
<div class="box" style="border-radius:6px">sm · 6</div>
<div class="box" style="border-radius:8px">md · 8</div>
<div class="box" style="border-radius:12px">lg · 12</div>
<div class="box" style="border-radius:16px">xl · 16</div>
<div class="box" style="border-radius:9999px">full</div>
</body></html>
