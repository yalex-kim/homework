<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:24px;background:var(--paper-0);display:flex;flex-direction:column;gap:10px;}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:6px;background:var(--paper-1);border:1px solid var(--border-soft);}
.sym{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--ink-1);width:60px;}
.name{flex:1;font-size:13px;color:var(--fg-muted);}
.price{font-family:var(--font-mono);font-size:13px;color:var(--ink-1);width:90px;text-align:right;}
.chg{font-family:var(--font-mono);font-size:12px;width:70px;text-align:right;padding:3px 7px;border-radius:4px;}
.up{background:var(--moss-soft);color:var(--moss-3);}
.down{background:var(--danger-soft);color:var(--danger-2);}
</style></head><body>
<div class="row"><span class="sym">AAPL</span><span class="name">Apple Inc.</span><span class="price">$184.32</span><span class="chg up">+1.24%</span></div>
<div class="row"><span class="sym">NVDA</span><span class="name">NVIDIA</span><span class="price">$912.45</span><span class="chg up">+2.80%</span></div>
<div class="row"><span class="sym">005930</span><span class="name">삼성전자</span><span class="price">₩72,400</span><span class="chg down">−0.55%</span></div>
</body></html>
