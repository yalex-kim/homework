<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
body{margin:0;padding:24px;background:var(--bg-app);}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-2);}
.cell i{font-size:22px;}
.cell span{font-family:var(--font-mono);font-size:10px;color:var(--fg-soft);}
</style></head><body>
<div class="grid">
  <div class="cell"><i class="ph ph-house"></i><span>house</span></div>
  <div class="cell"><i class="ph ph-check-square"></i><span>todo</span></div>
  <div class="cell"><i class="ph ph-notebook"></i><span>journal</span></div>
  <div class="cell"><i class="ph ph-airplane-tilt"></i><span>travel</span></div>
  <div class="cell"><i class="ph ph-chart-line-up"></i><span>stocks</span></div>
  <div class="cell"><i class="ph ph-calendar-blank"></i><span>calendar</span></div>
  <div class="cell"><i class="ph ph-bookmark-simple"></i><span>bookmark</span></div>
  <div class="cell"><i class="ph ph-wallet"></i><span>budget</span></div>
  <div class="cell"><i class="ph ph-magnifying-glass"></i><span>search</span></div>
  <div class="cell"><i class="ph ph-plus"></i><span>add</span></div>
  <div class="cell"><i class="ph ph-pencil-simple"></i><span>edit</span></div>
  <div class="cell"><i class="ph ph-trash"></i><span>delete</span></div>
  <div class="cell"><i class="ph ph-gear"></i><span>settings</span></div>
  <div class="cell"><i class="ph ph-user-circle"></i><span>user</span></div>
  <div class="cell"><i class="ph ph-sign-out"></i><span>logout</span></div>
  <div class="cell"><i class="ph ph-sun"></i><span>sun</span></div>
</div>
</body></html>
