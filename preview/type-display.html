<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:24px;background:var(--bg-app);}
.row{display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-soft);}
.row:last-child{border-bottom:none;}
.tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-soft);width:60px;flex:none;}
.size{font-family:var(--font-mono);font-size:11px;color:var(--fg-soft);margin-left:auto;flex:none;}
</style></head><body>
<div class="row"><span class="tag">h1</span><span style="font-family:var(--font-display);font-size:36px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;">오늘의 생각</span><span class="size">Lora 36/600</span></div>
<div class="row"><span class="tag">h2</span><span style="font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-0.02em;">가을의 교토</span><span class="size">Lora 28/600</span></div>
<div class="row"><span class="tag">h3</span><span style="font-family:var(--font-display);font-size:22px;font-weight:500;">이번 주 할 일</span><span class="size">Lora 22/500</span></div>
<div class="row"><span class="tag">h4</span><span style="font-family:var(--font-body);font-size:18px;font-weight:600;">섹션 제목</span><span class="size">Pretendard 18/600</span></div>
</body></html>
