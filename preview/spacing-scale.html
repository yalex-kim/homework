<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
body{margin:0;padding:20px;background:var(--bg-app);}
.row{display:flex;align-items:flex-end;gap:14px;}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
.box{background:var(--clay-soft);border:1px solid var(--clay-1);border-radius:4px;}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);}
.val{font-family:var(--font-mono);font-size:10px;color:var(--fg-soft);}
</style></head><body>
<div class="row">
  <div class="cell"><div class="box" style="width:4px;height:4px"></div><div class="lbl">1</div><div class="val">4px</div></div>
  <div class="cell"><div class="box" style="width:8px;height:8px"></div><div class="lbl">2</div><div class="val">8px</div></div>
  <div class="cell"><div class="box" style="width:12px;height:12px"></div><div class="lbl">3</div><div class="val">12px</div></div>
  <div class="cell"><div class="box" style="width:16px;height:16px"></div><div class="lbl">4</div><div class="val">16px</div></div>
  <div class="cell"><div class="box" style="width:24px;height:24px"></div><div class="lbl">5</div><div class="val">24px</div></div>
  <div class="cell"><div class="box" style="width:32px;height:32px"></div><div class="lbl">6</div><div class="val">32px</div></div>
  <div class="cell"><div class="box" style="width:48px;height:48px"></div><div class="lbl">7</div><div class="val">48px</div></div>
  <div class="cell"><div class="box" style="width:64px;height:64px"></div><div class="lbl">8</div><div class="val">64px</div></div>
  <div class="cell"><div class="box" style="width:96px;height:96px"></div><div class="lbl">9</div><div class="val">96px</div></div>
</div>
</body></html>
